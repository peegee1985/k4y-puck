name: Publish verified K4Y Puck firmware

on:
  workflow_dispatch:
  push:
    paths:
      - "release-requests/build-239.txt"
      - ".github/workflows/publish-staged-firmware.yml"

permissions:
  contents: write

concurrency:
  group: k4y-puck-firmware-release
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    env:
      VERSION: "239"
      VERSION_NAME: "0.4.5"
      STAGED_PREFIX: "staging/K4Y-Puck-239.bin.xz.part-"
      RELEASE_ARTIFACT: "K4Y-Puck-239.bin"
      EXPECTED_SIZE: "1647792"
      EXPECTED_SHA256: "f5b092a3fbb76659620c1d8ee710cf6bc868ebd084913d918986ae4a46cf7838"
      RESTORED_ARTIFACT: "K4Y-Puck-238.bin"
      RESTORED_PREFIX: "staging/K4Y-Puck-238.bin.xz.part-"
      RESTORED_SIZE: "1647520"
      RESTORED_SHA256: "a8a20ff48f96ce7ac68eab36a707de6660da1e15e436fb029a58f6b99cb91201"

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct firmware
        shell: bash
        run: |
          set -euo pipefail
          cat "${STAGED_PREFIX}"* > /tmp/K4Y-Puck-239.bin.xz
          xz --test /tmp/K4Y-Puck-239.bin.xz
          xz --decompress --stdout /tmp/K4Y-Puck-239.bin.xz > "$RELEASE_ARTIFACT"

          # Build 238 was previously correct, but a later direct binary write
          # truncated the public file. Restore it from its immutable staged bytes.
          cat "${RESTORED_PREFIX}"* > /tmp/K4Y-Puck-238.bin.xz
          xz --test /tmp/K4Y-Puck-238.bin.xz
          xz --decompress --stdout /tmp/K4Y-Puck-238.bin.xz > "$RESTORED_ARTIFACT"

      - name: Verify exact size and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          actual_size="$(stat --format=%s "$RELEASE_ARTIFACT")"
          actual_sha="$(sha256sum "$RELEASE_ARTIFACT" | cut -d ' ' -f 1)"
          test "$actual_size" = "$EXPECTED_SIZE"
          test "$actual_sha" = "$EXPECTED_SHA256"
          test "$(stat --format=%s "$RESTORED_ARTIFACT")" = "$RESTORED_SIZE"
          test "$(sha256sum "$RESTORED_ARTIFACT" | cut -d ' ' -f 1)" = "$RESTORED_SHA256"

      - name: Validate ESP32 application image
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet esptool
          python -m esptool image-info "$RELEASE_ARTIFACT"
          python - "$RELEASE_ARTIFACT" <<'PY'
          import pathlib
          import sys
          image = pathlib.Path(sys.argv[1]).read_bytes()
          if len(image) != int("1647792"):
              raise SystemExit("Unexpected firmware size")
          if not image or image[0] != 0xE9:
              raise SystemExit("Invalid ESP application magic")
          PY

      - name: Generate OTA manifest
        shell: bash
        run: |
          jq -n \
            --argjson version "$VERSION" \
            --arg versionName "$VERSION_NAME" \
            --arg url "https://raw.githubusercontent.com/peegee1985/k4y-puck/main/$RELEASE_ARTIFACT" \
            --arg sha256 "$EXPECTED_SHA256" \
            --argjson size "$EXPECTED_SIZE" \
            '{version:$version,versionName:$versionName,url:$url,sha256:$sha256,size:$size}' \
            > latest.json

      - name: Publish only verified bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RELEASE_ARTIFACT" "$RESTORED_ARTIFACT" latest.json
          git diff --cached --check
          git commit -m "release: publish verified K4Y Puck build $VERSION"
          git push

      - name: Verify bytes from immutable public URL
        shell: bash
        run: |
          set -euo pipefail
          release_commit="$(git rev-parse HEAD)"
          public_base="https://raw.githubusercontent.com/peegee1985/k4y-puck/$release_commit"
          downloaded=false
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location \
              "$public_base/$RELEASE_ARTIFACT" -o /tmp/public-firmware.bin; then
              downloaded=true
              break
            fi
            sleep 5
          done
          test "$downloaded" = true
          test "$(stat --format=%s /tmp/public-firmware.bin)" = "$EXPECTED_SIZE"
          test "$(sha256sum /tmp/public-firmware.bin | cut -d ' ' -f 1)" = "$EXPECTED_SHA256"
          curl --fail --silent --show-error --location \
            "$public_base/$RESTORED_ARTIFACT" -o /tmp/public-restored.bin
          test "$(stat --format=%s /tmp/public-restored.bin)" = "$RESTORED_SIZE"
          test "$(sha256sum /tmp/public-restored.bin | cut -d ' ' -f 1)" = "$RESTORED_SHA256"
          curl --fail --silent --show-error --location \
            "$public_base/latest.json" -o /tmp/public-latest.json
          test "$(jq -r .version /tmp/public-latest.json)" = "$VERSION"
          test "$(jq -r .versionName /tmp/public-latest.json)" = "$VERSION_NAME"
          test "$(jq -r .sha256 /tmp/public-latest.json)" = "$EXPECTED_SHA256"
          test "$(jq -r .size /tmp/public-latest.json)" = "$EXPECTED_SIZE"
